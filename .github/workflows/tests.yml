name: tests

on:
  push:
    branches:
    - master
    - AlloyScattering

  pull_request:
    branches:
    - master


jobs:
  build:

    strategy:
      max-parallel: 20
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: install pip, pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    - name: Install banduppy and dependencies
      run: |
        pip install -e .
    - name: Run tests
      env:
        PYTHONPATH: ${{ env.PYTHONPATH }}
      run: |
        pytest --color=yes
