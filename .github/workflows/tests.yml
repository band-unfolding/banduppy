name: tests

on:
  push:
    branches:
    - [main,AlloyScattering]
  pull_request:
    branches:
    - main


jobs:
  build:

    strategy:
      max-parallel: 20
      matrix:
        os: [ubuntu-latest]
        python-version: [ "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: install pip, pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    - name: Install banduppy and dependencies
      run: |
        pip install -e .
    - name: Run tests
      run: pytest
      env:
        PYTHONPATH: ${{ env.PYTHONPATH }}
    - name: pytest
      run: |
        pytest --color=yes
